name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Go race, vet and JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: Check Go formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Go static analysis
        run: go vet ./...
      - name: Go race tests
        run: go test -race -count=1 ./...
      - name: JavaScript syntax and unit tests
        run: |
          for script in web/*.js tests/*.mjs; do
            node --check "$script"
          done
          node --test tests/*.test.mjs

  cross-build:
    name: Build ${{ matrix.os }} binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: linux
            architectures: 'amd64 arm64 386'
          - os: darwin
            architectures: 'amd64 arm64'
          - os: windows
            architectures: 'amd64 arm64'
          - os: freebsd
            architectures: 'amd64'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: go.sum
      - name: Compile application and native throughput client
        env:
          GOOS: ${{ matrix.os }}
          ARCHITECTURES: ${{ matrix.architectures }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p artifacts
          for architecture in $ARCHITECTURES; do
            export GOARCH="$architecture"
            target="testspeed-$GOOS-$GOARCH"
            mkdir -p "bin/$target"
            extension=''
            if [ "$GOOS" = windows ]; then extension='.exe'; fi
            go build -trimpath -ldflags='-s -w' -o "bin/$target/testspeed$extension" .
            go build -trimpath -ldflags='-s -w' -o "bin/$target/throughput$extension" ./tools/throughput
            tar -czf "artifacts/$target.tar.gz" -C "bin/$target" .
          done
          sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  container-browser:
    name: Scratch container and real Chromium measurements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:8080
      TEST_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: Install pinned Playwright and its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/testspeed-playwright" --no-audit --no-fund --save-exact playwright@1.64.0
          node "$RUNNER_TEMP/testspeed-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          printf 'PLAYWRIGHT_MODULE=%s\n' "$RUNNER_TEMP/testspeed-playwright/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Select the installed Chromium explicitly
        run: |
          node -e 'console.log("CHROMIUM_PATH=" + require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Build scratch image
        run: |
          mkdir -p "$TEST_ARTIFACT_DIR"
          docker build --tag testspeed:ci . 2>&1 | tee "$TEST_ARTIFACT_DIR/docker-build.log"
      - name: Verify normal Compose and Snap override on standard Docker
        run: python3 tools/verify-compose.py 2>&1 | tee "$TEST_ARTIFACT_DIR/compose-snap-validation.log"
      - name: Verify optional SQLite sharing on a non-root read-only container
        run: python3 tools/verify-sharing.py 2>&1 | tee "$TEST_ARTIFACT_DIR/compose-sharing-validation.log"
      - name: Start default single-port WebSocket container and check protocol v2
        run: |
          docker run --detach --name testspeed-ci --read-only --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:8080:8080 testspeed:ci
          test "$(docker inspect --format '{{.Config.User}}' testspeed-ci)" = '65532:65532'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' testspeed-ci)" = true
          for attempt in {1..30}; do
            if curl --fail --silent --connect-timeout 1 --max-time 2 "$BASE_URL/healthz" > "$TEST_ARTIFACT_DIR/health.json"; then break; fi
            printf 'Waiting for testspeed readiness (%s/30)\n' "$attempt"
            sleep 1
          done
          curl --fail --silent --show-error --connect-timeout 1 --max-time 2 "$BASE_URL/healthz" > "$TEST_ARTIFACT_DIR/health.json"
          python3 tools/readiness.py | tee "$TEST_ARTIFACT_DIR/readiness.log"
      - name: Start optional HTTP multi-port fixture
        run: |
          docker run --detach --name testspeed-http-ci --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env TEST_TRANSPORT=http --env MEASUREMENT_PORTS=8081,8082,8083,8084 --env MAX_TEST_STREAMS=24 \
            --env PUBLIC_ORIGIN=http://127.0.0.1:9480 \
            --env MEASUREMENT_ORIGINS=http://127.0.0.1:9481,http://127.0.0.1:9482,http://127.0.0.1:9483,http://127.0.0.1:9484 \
            --publish 127.0.0.1:9480-9484:8080-8084 testspeed:ci
          test "$(docker inspect --format '{{.Config.User}}' testspeed-http-ci)" = '65532:65532'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' testspeed-http-ci)" = true
          for attempt in {1..30}; do
            if curl --fail --silent --connect-timeout 1 --max-time 2 http://127.0.0.1:9480/healthz > "$TEST_ARTIFACT_DIR/http-health.json"; then break; fi
            printf 'Waiting for HTTP testspeed readiness (%s/30)\n' "$attempt"
            sleep 1
          done
          curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:9480/healthz > "$TEST_ARTIFACT_DIR/http-health.json"
          BASE_URL=http://127.0.0.1:9480 TEST_TRANSPORT=http EXPECTED_MAX_STREAMS=24 EXPECTED_ORIGIN_COUNT=4 python3 tools/readiness.py | tee "$TEST_ARTIFACT_DIR/http-readiness.log"
      - name: Start optional HTTP single-port fixture
        run: |
          docker run --detach --name testspeed-single-port-ci --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env TEST_TRANSPORT=http --env MEASUREMENT_PORTS= --env MAX_TEST_STREAMS=4 \
            --env PUBLIC_ORIGIN=http://127.0.0.1:9490 --publish 127.0.0.1:9490:8080 testspeed:ci
          test "$(docker inspect --format '{{.Config.User}}' testspeed-single-port-ci)" = '65532:65532'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' testspeed-single-port-ci)" = true
          for attempt in {1..30}; do
            if curl --fail --silent --connect-timeout 1 --max-time 2 http://127.0.0.1:9490/healthz > "$TEST_ARTIFACT_DIR/single-port-health.json"; then break; fi
            printf 'Waiting for single-port testspeed readiness (%s/30)\n' "$attempt"
            sleep 1
          done
          curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:9490/healthz > "$TEST_ARTIFACT_DIR/single-port-health.json"
          BASE_URL=http://127.0.0.1:9490 TEST_TRANSPORT=http EXPECTED_MAX_STREAMS=4 EXPECTED_ORIGIN_COUNT=1 python3 tools/readiness.py | tee "$TEST_ARTIFACT_DIR/single-port-readiness.log"
      - name: Browser default WebSocket transport, 8 streams and real TCP concurrency
        run: node tests/browser-websocket.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-websocket.log"
      - name: Browser interface, language switching and default single-port behavior
        run: node tests/browser-ui.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-ui.log"
      - name: Browser IP, locations, pending zero and GeoIP failure handling
        run: node tests/browser-network-info.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-network-info.log"
      - name: Start explicit sharing fixtures with and without a write token
        run: |
          for port in 9515 9516; do
            token_args=()
            if [ "$port" = 9516 ]; then token_args=(--env SHARE_WRITE_TOKEN=testspeed-ci-share-token); fi
            docker run --detach --name "testspeed-share-$port-ci" --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /var/lib/testspeed:rw,uid=65532,gid=65532,mode=0750 \
              --env GEOIP_ENABLED=false --env SHARE_DB_PATH=/var/lib/testspeed/results.sqlite \
              "${token_args[@]}" --publish "127.0.0.1:$port:8080" testspeed:ci
            for attempt in {1..30}; do
              if curl --fail --silent --connect-timeout 1 --max-time 2 "http://127.0.0.1:$port/healthz" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent --show-error "http://127.0.0.1:$port/healthz"
          done
      - name: Browser real measurement selection, adaptive duration, budget, local history and exports
        env:
          SHARE_BASE_URL: http://127.0.0.1:9515
          SHARE_TOKEN_BASE_URL: http://127.0.0.1:9516
          FEATURE_SHARE_TOKEN: testspeed-ci-share-token
          FEATURE_REQUIRE_SHARE: '1'
        run: node tests/browser-features.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-features.log"
      - name: Browser both-direction stable and budget completion on WebSocket and HTTP
        env:
          HTTP_SINGLE_BASE_URL: http://127.0.0.1:9490
          POLICY_REQUIRE_HTTP: '1'
        run: node tests/browser-measurement-policies.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-measurement-policies.log"
      - name: Browser optional shared results, literal text and revocation
        env:
          BASE_URL: http://127.0.0.1:9516
          SHARE_WRITE_TOKEN: testspeed-ci-share-token
        run: node tests/browser-share.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-share.log"
      - name: Browser stability sampling, CSV, lifecycle and production CSP
        run: node tests/browser-stability.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-stability.log"
      - name: Browser optional HTTP network reachability and single-port fallback
        env:
          MULTIPORT_BASE_URL: http://127.0.0.1:9480
          SINGLEPORT_BASE_URL: http://127.0.0.1:9490
        run: node tests/browser-network-access.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-network-access.log"
      - name: Browser optional HTTP flows, concurrency, mobile and cancellation
        env:
          BASE_URL: http://127.0.0.1:9480
          SMOKE_STREAM_COUNTS: '1,4,12,24'
        run: node tests/browser-smoke.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-smoke.log"
      - name: Browser optional HTTP accuracy at 80, 150 and 300 ms latency
        env:
          BASE_URL: http://127.0.0.1:9480
        run: node tests/browser-accuracy.mjs 2>&1 | tee "$TEST_ARTIFACT_DIR/browser-accuracy.log"
      - name: Collect container logs and stop three known CI test services
        if: always()
        run: |
          mkdir -p "$TEST_ARTIFACT_DIR"
          for container in testspeed-ci testspeed-http-ci testspeed-single-port-ci testspeed-share-9515-ci testspeed-share-9516-ci; do
            docker logs "$container" > "$TEST_ARTIFACT_DIR/$container.log" 2>&1 || true
            docker rm --force "$container" || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-and-container-reports
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 14
