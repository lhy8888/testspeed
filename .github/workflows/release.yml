name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  RELEASE_TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify stable release tag and source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a stable version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a stable tag such as v0.1.0; received %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: Check Go formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Go static analysis and race tests
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: JavaScript syntax and unit tests
        run: |
          for script in web/*.js tests/*.mjs; do
            node --check "$script"
          done
          node --test tests/*.test.mjs

  publish:
    name: Build packages and publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Package eight targets and verify checksums
        run: tools/package.sh
      - name: Upload all packages before making the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Single-node browser speed test platform.\n\nSource commit: %s.\n\nPackages include the application, native throughput client, README, and Linux systemd examples. Verify downloads with SHA256SUMS.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/testspeed-release-notes.md"
          gh release create "$RELEASE_TAG" artifacts/dist/testspeed-*.tar.gz artifacts/dist/SHA256SUMS \
            --verify-tag --draft --title "testspeed $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/testspeed-release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
