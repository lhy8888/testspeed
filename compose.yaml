services:
  testspeed:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      NODE_ID: "node-1"
      NODE_NAME: "本地节点"
      MAX_CONCURRENT_TEST_REQUESTS: "128"
      TEST_TRANSPORT: "websocket"
      MEASUREMENT_PORTS: ""
      MAX_TEST_STREAMS: "30"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      SERVER_LOCATION: "${SERVER_LOCATION:-}"
      GEOIP_ENABLED: "${GEOIP_ENABLED:-true}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
